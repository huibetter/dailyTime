name: Linux build

on:
  push:
    branches:
      - codex/feature/linux
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  build:
    name: Debian 13 amd64
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential curl file git libayatana-appindicator3-dev \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev \
            patchelf pkg-config wget
      - uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build Debian and AppImage bundles
        run: npm run tauri:build -- --bundles deb,appimage
      - name: Verify bundle outputs
        run: |
          test -n "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: dailytime-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
